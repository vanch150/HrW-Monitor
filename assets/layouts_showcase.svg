    <rect x="14" y="106" width="137" height="64" rx="6" fill="url(#ecgGrid)" stroke="#ff0055" stroke-opacity="0.3"/>
    <path d="M 18 142 L 38 142 L 44 136 L 50 142 L 55 148 L 62 114 L 68 156 L 74 142 L 84 134 L 92 142 L 118 142 L 125 114 L 131 156 L 137 142 L 147 142" fill="none" stroke="#ff0055" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
