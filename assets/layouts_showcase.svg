    <polygon points="0,26 150,26 165,41 165,186 15,186 0,171" fill="#10141f" stroke="#ffaa00" stroke-opacity="0.55" stroke-width="1.5"/>
    <line x1="0" y1="26" x2="0" y2="171" stroke="#ffaa00" stroke-width="4"/>
    <text x="16" y="44" fill="#64748b" font-family="monospace" font-weight="700" font-size="8">AVG 112</text>
    <text x="22" y="96" fill="#ffaa00" font-size="22">⚡</text>
    <text x="52" y="102" fill="#ffffff" font-family="monospace" font-weight="900" font-size="38">134</text>
    <path d="M 16 142 L 42 138 L 70 144 L 102 126 L 148 120" fill="none" stroke="#ffaa00" stroke-width="2.2"/>
