    <rect x="0" y="26" width="165" height="160" rx="18" fill="#151924" fill-opacity="0.35" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="4 4"/>
    <rect x="6" y="84" width="153" height="44" rx="22" fill="#151924" stroke="#00ffcc" stroke-opacity="0.45" stroke-width="1.5"/>
