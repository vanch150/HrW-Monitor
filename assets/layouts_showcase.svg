    <rect x="0" y="26" width="165" height="160" rx="22" fill="#151924" stroke="#ec4899" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle cx="82" cy="82" r="32" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="6"/>
    <circle cx="82" cy="82" r="32" fill="none" stroke="url(#arcG)" stroke-width="6" stroke-linecap="round" stroke-dasharray="150 200" transform="rotate(-90 82 82)"/>
    <text x="82" y="89" text-anchor="middle" fill="#ec4899" font-size="20">❤️</text>
    <text x="82" y="152" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="30">118</text>
    <text x="82" y="172" text-anchor="middle" fill="#ec4899" font-family="monospace" font-weight="800" font-size="9">BPM // MAX 154</text>
