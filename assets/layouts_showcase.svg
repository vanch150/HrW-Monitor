    <text x="66" y="88" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="36">84</text>
    <text x="118" y="75" fill="#00ffcc" font-family="monospace" font-weight="800" font-size="9">BPM</text>
    <path d="M 16 135 Q 45 125, 80 132 T 148 118" fill="none" stroke="#00ffcc" stroke-width="2.2" stroke-linecap="round"/>
