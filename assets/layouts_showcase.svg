    <rect x="0" y="26" width="165" height="160" rx="12" fill="#080d11" stroke="#ff0055" stroke-opacity="0.5" stroke-width="1.4"/>
    <text x="24" y="82" fill="#ff0055" font-size="20">❤️</text>
